name: Atlas verify
on:
  push:
    branches: [main, dev/style-studio, dev/semantic-features, export-test]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm pack --workspace=@atlas/core --dry-run && npm pack --workspace=@atlas/style-core --dry-run && npm pack --workspace=@atlas/react --dry-run
      # E2E exercises the actual MapLibre worker in Chromium instead of
      # relying on a green TypeScript build alone.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: atlas-browser-test-results
          path: test-results/
          if-no-files-found: ignore
